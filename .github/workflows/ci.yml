name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

env:
  NOLOGO: 1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bun run check

      - name: Typecheck (browser)
        run: cd packages/browser && bun run typecheck

      - name: Typecheck (tiers)
        run: cd packages/tiers && bun run typecheck

      - name: Typecheck (api)
        run: cd apps/api && bun run typecheck

      - name: Test
        run: bun test
